version: '3.8'

services:
  eventsync-api:
    build:
      context: ./eventsync-api
      dockerfile: Dockerfile
    container_name: eventsync-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - ENVIRONMENT=development
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - SUPABASE_URL=${SUPABASE_URL:-}
      - SUPABASE_KEY=${SUPABASE_KEY:-}
    volumes:
      - ./eventsync-api:/app
      - /app/__pycache__

  eventsync-web:
    build:
      context: ./eventsync-web
      dockerfile: Dockerfile
    container_name: eventsync-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - eventsync-api
    volumes:
      - ./eventsync-web:/app
      - /app/node_modules
      - /app/.next
